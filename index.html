    </div>
  </header>

  <!-- 통신사 카드: JS가 getCarriers()로 자동 생성 (헬로/KT M/유플) -->
  <div id="carrier-list"></div>

  <!-- 카드 펼침 내용 템플릿 — JS가 통신사마다 복제해서 넣음 -->
  <template id="carrier-form-tpl">
    <div class="carrier-expanded">
      <header style="padding: 8px 0 16px;">
        <p class="subtitle">사용량 입력 후 버튼을 눌러주세요</p>
      </header>
      <form class="form-card carrier-form" autocomplete="off">
        <h2>내 사용량 입력</h2>
        <div class="field">
          <label>데이터 사용량</label>
          <div class="input-row">
            <input type="number" class="in-data" value="7" min="0" step="0.5">
            <span class="unit">GB</span>
          </div>
        </div>
        <div class="field">
          <label>통화 사용량</label>
          <div class="input-row">
            <input type="number" class="in-call" value="100" min="0" step="10">
            <span class="unit">분</span>
          </div>
        </div>
        <div class="field">
          <label>문자 사용량</label>
          <div class="input-row">
            <input type="number" class="in-sms" value="100" min="0" step="10">
            <span class="unit">건</span>
          </div>
        </div>
        <button type="submit" class="compare-btn" style="margin-top:14px;">이 통신사 요금제 보기</button>
      </form>
      <div class="results"></div>
    </div>
  </template>
</section>



<!--
  계산 로직 + 데이터: hello-test.js에서 plans, benefits, 함수들 전역 노출.
-->
<script src="hello-test.js"></script>

<script>
  // ============================================================
  //  통신사 카드 자동 생성 + 통신사별 요금제 필터
  //  데이터/계산: hello-test.js (benefits, plans, getCarriers,
  //  getPlanResult, findOptimalMonths, calculateRealProfit)
  // ============================================================

  const fmt = (n) => (n >= 0 ? '+' : '') + n.toLocaleString('ko-KR');
  const man = (n) => Math.round(n / 10000); // 원 → 만원

  // 요금제 스펙 한 줄
  function formatPlanSpec(plan) {
    let dataPart = `데이터 ${plan.데이터}GB`;
    if (plan.데이터플러스) {
      const speed = String(plan.데이터플러스).match(/[\d.]+Mbps/);
      if (speed) dataPart += ` (소진 후 ${speed[0]})`;
    }
    const callPart = plan.통화 === "기본" ? "통화 무제한" : `통화 ${plan.통화}분`;
    const smsPart  = plan.문자 === "기본" ? "문자 무제한" : `문자 ${plan.문자}건`;
    return `${dataPart} · ${callPart} · ${smsPart}`;
  }

  // ---------- 메인: 통신사 카드 생성 ----------
  const carriers = getCarriers(); // [{통신사, 후킹, 가입URL}]
  const listEl = document.getElementById('carrier-list');
  const tpl = document.getElementById('carrier-form-tpl');

  // 히어로 최대값 = 후킹 최댓값
  const heroMax = Math.max(...carriers.map(c => c.후킹));
  const heroEl = document.getElementById('hero-max');
  if (heroEl) heroEl.textContent = man(heroMax);

  // 후킹 높은 순으로 카드 배치
  const ordered = [...carriers].sort((a, b) => b.후킹 - a.후킹);

  ordered.forEach((c, idx) => {
    const card = document.createElement('article');
    card.className = 'carrier-card ready' + (idx === 0 ? ' featured' : '');
    card.dataset.carrier = c.통신사;
    card.dataset.url = c.가입URL;

    const rank = idx === 0 ? '👑 혜택 합 최대' : '혜택 ' + (idx + 1) + '위';
    const net = c.통신사 === 'KT M모바일' ? 'KT 망' : 'LG U+ 망';

    card.innerHTML =
      '<span class="carrier-rank-badge">' + rank + '</span>' +
      '<div class="carrier-head">' +
        '<span class="carrier-name">' + c.통신사 + '</span>' +
        '<span class="carrier-network">' + net + '</span>' +
      '</div>' +
      '<div class="benefit-range">' +
        '<div class="value-line">공통 혜택 <span class="hl">최대 ' + man(c.후킹) + '만원</span></div>' +
        '<div class="note">요금제 가입 시 누구나 받는 현금성 혜택 합계</div>' +
      '</div>' +
      '<button type="button" class="go-btn">' +
        '<span class="go-btn-text-closed">요금제 보기 →</span>' +
        '<span class="go-btn-text-open">접기 ↑</span>' +
      '</button>';

    // 펼침(폼+결과) 템플릿 복제해서 삽입
    card.appendChild(tpl.content.cloneNode(true));
    listEl.appendChild(card);

    // --- 카드 헤더 클릭 → 펼침/접힘 ---
    card.addEventListener('click', (e) => {
      if (e.target.closest('.carrier-expanded')) return; // 폼 영역 클릭은 무시
      card.classList.toggle('open');
      if (card.classList.contains('open')) {
        setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
      }
    });

    // --- 폼 제출 → 이 통신사 요금제만 비교 ---
    const form = card.querySelector('.carrier-form');
    const resultsBox = card.querySelector('.results');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = {
        data: parseFloat(form.querySelector('.in-data').value) || 0,
        call: parseInt(form.querySelector('.in-call').value, 10) || 0,
        sms:  parseInt(form.querySelector('.in-sms').value, 10) || 0
      };
      renderResults(input, c.통신사, resultsBox, c.가입URL);
    });
  });

  // ============================================================
  //  결과 렌더링 (해당 통신사 요금제만)
  // ============================================================
  function renderResults(input, 통신사, resultsEl, 가입URL) {
    // 1) 이 통신사 + 데이터 충족 요금제만
    const filtered = plans.filter(p => p.통신사 === 통신사 && p.데이터 >= input.data);

    if (filtered.length === 0) {
      resultsEl.innerHTML =
        '<div class="empty-result"><span class="icon">📭</span>' +
        '매칭되는 요금제가 없습니다<br>' +
        '<span style="font-size:12px;color:#9ca3af;">데이터 ' + input.data + 'GB 이상 요금제가 없어요</span></div>';
      return;
    }

    // 2) 효율 정점 월환산 순 정렬
    const sorted = [...filtered].sort((a, b) =>
      findOptimalMonths(b).monthlyProfit - findOptimalMonths(a).monthlyProfit);

    const html = [];
    html.push('<div class="results-header">' + 통신사 + ' 추천<span class="count">· ' +
              sorted.length + '개 · 효율 정점 기준</span></div>');

    // 1위 풀 카드
    const top = sorted[0];
    const tr = getPlanResult(top);
    const topOpt = tr.optimal;
    html.push(
      '<article class="plan-card top clickable" data-plan-name="' + top.요금제명 + '">' +
        '<span class="plan-rank">1위</span>' +
        '<div class="plan-name">' + top.요금제명 + '</div>' +
        '<div class="plan-monthly">월 ' + top.월요금.toLocaleString() + '원 · ' +
          (top.카테고리.length ? top.카테고리.join(', ') : '일반') + '</div>' +
        '<div class="plan-spec">' + formatPlanSpec(top) + '</div>' +
        '<div class="plan-optimal">' +
          '<div class="recommend-line">💡 ' + topOpt.optimalN + '개월 사용 추천</div>' +
          '<span class="value">' + fmt(topOpt.totalProfit) + '원</span>' +
          '<div class="subtitle-line">' + topOpt.optimalN + '개월 후 다른 통신사로 갈아타기</div>' +
        '</div>' +
        '<div class="plan-periods">' +
          ['6','7','12','24'].map(m => {
            const v = tr.periods[m].실질이익;
            return '<div class="col"><div class="pn">' + m + '개월</div>' +
                   '<div class="pv ' + (v<0?'loss':'') + '">' + fmt(v) + '</div></div>';
          }).join('') +
        '</div>' +
        (formatOptionLine(top) ? '<div class="plan-option-line">💡 ' + formatOptionLine(top).trim() + '</div>' : '') +
        '<button type="button" class="plan-go-btn">가입하러 가기 →</button>' +
      '</article>'
    );

    // 2위 이하 압축
    if (sorted.length > 1) {
      html.push('<button type="button" class="more-results-toggle">다른 요금제 비교 보기 (' +
                (sorted.length - 1) + '개)<span class="arrow">▼</span></button>' +
                '<div class="more-results-list">');
      sorted.slice(1).forEach((plan, i) => {
        const r = getPlanResult(plan);
        html.push(
          '<div class="plan-row clickable" data-plan-name="' + plan.요금제명 + '">' +
            '<div class="rank">' + (i + 2) + '위</div>' +
            '<div class="info"><div class="name">' + plan.요금제명 + '</div>' +
            '<div class="meta">월 ' + plan.월요금.toLocaleString() + '원 · ' + formatPlanSpec(plan) + '</div></div>' +
            '<div class="profit">' + fmt(r.optimal.totalProfit) + '원<span class="period">' +
              r.optimal.optimalN + '개월 기준</span></div>' +
          '</div>'
        );
      });
      html.push('</div>');
    }

    resultsEl.innerHTML = html.join('');

    // 더보기 토글
    const moreToggle = resultsEl.querySelector('.more-results-toggle');
    const moreList = resultsEl.querySelector('.more-results-list');
    if (moreToggle && moreList) {
      moreToggle.addEventListener('click', () => {
        moreToggle.classList.toggle('open');
        moreList.classList.toggle('open');
      });
    }

    // 가입하러 가기 (통신사별 URL)
    function handlePlanClick(planName) {
      alert("'" + planName + "' 요금제로 가입하려면 " + 통신사 + " 사이트에서 검색해주세요.");
      window.open(가입URL, '_blank');
    }
    const goBtn = resultsEl.querySelector('.plan-go-btn');
    if (goBtn) goBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handlePlanClick(goBtn.closest('.plan-card').dataset.planName);
    });
    resultsEl.querySelectorAll('.plan-row.clickable').forEach(row => {
      row.addEventListener('click', () => handlePlanClick(row.dataset.planName));
    });

    setTimeout(() => {
      const tc = resultsEl.querySelector('.plan-card.top');
      if (tc) tc.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
</script>

</body>
</html>
