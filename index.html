<script src="hello-test.js"></script>

<script>
  // ============================================================
  // 단계 전환
  // ============================================================
  const step1 = document.getElementById('step-1');
  const step2 = document.getElementById('step-2');

  function goStep(n) {
    step1.classList.toggle('active', n === 1);
    step2.classList.toggle('active', n === 2);
    window.scrollTo(0, 0);
  }

  document.querySelector('.carrier-card.ready').addEventListener('click', () => goStep(2));
  document.getElementById('back-to-step1').addEventListener('click', () => goStep(1));

  // (옵션 혜택 영역은 항상 펼친 상태로 표시 — 토글 제거됨)

  // ============================================================
  // 결과 렌더링
  // ============================================================
  const fmt = (n) => (n >= 0 ? '+' : '') + n.toLocaleString('ko-KR');

  function renderResults(input) {
    const includeS26 = input.options.includes('s26');
    const step2Subtitle = document.querySelector('#step-2 .subtitle');
    const resultsEl = document.getElementById('results');

    // 1) 입력 데이터 사용량으로 plans 필터링 — 데이터가 모자라면 후보에서 제외
    const filtered = plans.filter(p => p.데이터 >= input.data);
    console.log(`[필터링] ${input.data}GB 이상: ${filtered.length}개 매칭`,
                filtered.map(p => p.요금제명));

    // 2) 매칭 0건이면 부제 + 빈 상태 출력 후 종료
    if (filtered.length === 0) {
      step2Subtitle.textContent = '매칭되는 요금제가 없습니다';
      resultsEl.innerHTML = `
        <div class="empty-result">
          <span class="icon">📭</span>
          매칭되는 요금제가 없습니다<br>
          <span style="font-size: 12px; color: #9ca3af;">데이터 ${input.data}GB 이상을 제공하는 요금제가 없어요</span>
        </div>`;
      return;
    }

    // 3) Step 2 부제 동적 갱신
    step2Subtitle.textContent = `데이터 ${input.data}GB 기준 ${filtered.length}개 요금제 비교`;

    // 4) 효율 정점 월환산 기준으로 정렬
    const sorted = [...filtered].sort((a, b) =>
      findOptimalMonths(b).monthlyProfit - findOptimalMonths(a).monthlyProfit);

    const html = [];
    html.push(`<div class="results-header">추천 결과<span class="count">· ${sorted.length}개 · 효율 정점 기준</span></div>`);

    sorted.forEach((plan, i) => {
      const r = getPlanResult(plan);
      // S26 옵션 적용 시 모든 시점에 +30,000 합산 (미리 본 값에 표시용)
      const s26Boost = includeS26 && (plan.옵션혜택 || []).includes('hello-갤럭시s26') ? 30000 : 0;

      const p6  = r.periods[6].실질이익  + s26Boost;
      const p7  = r.periods[7].실질이익  + s26Boost;
      const p12 = r.periods[12].실질이익 + s26Boost;
      const p24 = r.periods[24].실질이익 + s26Boost;
      const opt = r.optimal;
      const optProfit = opt.totalProfit + s26Boost;

      // 표시용 핵심 이익 = 효율 정점 시점의 실질이익
      // 개발자 용어("정점") 대신 사용자 친화 표현으로 변경
      const displayValue = optProfit;
      const recommendLine = `💡 ${opt.optimalN}개월 사용 추천`;
      const subtitleLine = `${opt.optimalN}개월 후엔 다른 통신사로 갈아타기`;

      const optionLine = formatOptionLine(plan);

      html.push(`
        <article class="plan-card ${i === 0 ? 'top' : ''}">
          <span class="plan-rank">${i + 1}위</span>
          <div class="plan-name">${plan.요금제명}</div>
          <div class="plan-monthly">월 ${plan.월요금.toLocaleString()}원 · ${plan.카테고리.length ? plan.카테고리.join(', ') : '일반'}</div>

          <div class="plan-optimal">
            <div class="recommend-line">${recommendLine}</div>
            <span class="value">${fmt(displayValue)}원</span>
            <div class="subtitle-line">${subtitleLine}</div>
          </div>

          <div class="plan-periods">
            <div class="col"><div class="pn">6개월</div><div class="pv ${p6<0?'loss':''}">${fmt(p6)}</div></div>
            <div class="col"><div class="pn">7개월</div><div class="pv ${p7<0?'loss':''}">${fmt(p7)}</div></div>
            <div class="col"><div class="pn">12개월</div><div class="pv ${p12<0?'loss':''}">${fmt(p12)}</div></div>
            <div class="col"><div class="pn">24개월</div><div class="pv ${p24<0?'loss':''}">${fmt(p24)}</div></div>
          </div>

          ${optionLine && !includeS26 ? `<div class="plan-option-line">💡 ${optionLine.trim()}</div>` : ''}
          ${optionLine && includeS26 ? `<div class="plan-option-line">✅ 갤럭시 S26 옵션 +30,000원 반영됨</div>` : ''}
        </article>
      `);
    });

    document.getElementById('results').innerHTML = html.join('');
  }

  // ============================================================
  // 비교하기 제출
  // ============================================================
  const compareForm = document.getElementById('compare-form');
  compareForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const input = {
      data: parseFloat(document.getElementById('data').value) || 0,
      call: parseInt(document.getElementById('call').value, 10) || 0,
      sms: parseInt(document.getElementById('sms').value, 10) || 0,
      options: Array.from(document.querySelectorAll('input[name="opt"]:checked')).map(el => el.value)
    };
    console.log('[비교하기 입력]', input);
    renderResults(input);
  });
</script>

</body>
</html>
